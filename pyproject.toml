[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-oauth"
dynamic = ["version"]
description = "A plugin for OpenVoiceOS hardware abstraction layer"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.5"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-utils>=0.4.1,<1.0.0",
    "ovos-bus-client>=0.0.3,<3.0.0",
    "Flask>=0.12",
    "oauthlib~=3.0",
    "qrcode[pil]~=7.3.1"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-oauth"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-oauth" = "ovos_PHAL_plugin_oauth:OAuthPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_oauth.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_oauth*"]

[tool.setuptools.package-data]
ovos_PHAL_plugin_oauth = ["*.json"]
